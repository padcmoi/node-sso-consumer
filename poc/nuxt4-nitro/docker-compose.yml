name: poc-nuxt4-nitro-api

services:
  db:
    image: mariadb:11.4
    container_name: poc-nuxt4-nitro-api-db
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MARIADB_DATABASE: ${DB_NAME}
      MARIADB_USER: ${DB_USER}
      MARIADB_PASSWORD: ${DB_PASSWORD}
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - backend
    healthcheck:
      test: ['CMD', 'healthcheck.sh', '--connect', '--innodb_initialized']
      interval: 5s
      timeout: 5s
      retries: 40

  phpmyadmin:
    image: phpmyadmin:5
    container_name: poc-nuxt4-nitro-api-pma
    restart: unless-stopped
    ports:
      - '${PMA_PORT}:80'
    environment:
      PMA_HOST: db
      PMA_PORT: '3306'
      UPLOAD_LIMIT: 64M
    depends_on:
      db:
        condition: service_healthy
    networks:
      - backend

  app:
    build:
      context: .
    container_name: poc-nuxt4-nitro-api-app
    restart: unless-stopped
    ports:
      - '${APP_PORT}:3000'
    environment:
      NUXT_DB_HOST: db
      NUXT_DB_PORT: '3306'
      NUXT_DB_USER: ${DB_USER}
      NUXT_DB_PASSWORD: ${DB_PASSWORD}
      NUXT_DB_NAME: ${DB_NAME}
      NUXT_ADMIN_EMAIL: ${ADMIN_EMAIL}
      NUXT_ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      NUXT_SESSION_TTL_HOURS: '168'
    depends_on:
      db:
        condition: service_healthy
    networks:
      - backend

volumes:
  db_data:

networks:
  backend:
    driver: bridge
